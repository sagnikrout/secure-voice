<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Deep graphite squircle container -->
  <rect width="256" height="256" rx="56" fill="#0D1117" />

  <!-- Cryptographic Shield Outline -->
  <path
    d="M 128 36 C 172 36, 204 54, 204 54 C 204 134, 170 198, 128 224 C 86 198, 52 134, 52 54 C 52 54, 84 36, 128 36 Z"
    fill="url(#shield-fill)"
    stroke="url(#shield-border)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Acoustic Soundwave Harmonic Bars -->
  <g fill="url(#bar-grad)">
    <!-- Edge Bar Left -->
    <rect x="80" y="118" width="8" height="20" rx="4" opacity="0.6" />

    <!-- Outer Bar Left -->
    <rect x="96" y="106" width="8" height="44" rx="4" opacity="0.8" />

    <!-- Mid Bar Left -->
    <rect x="112" y="92" width="8" height="72" rx="4" opacity="0.95" />

    <!-- Center Resonant Core Bar -->
    <rect x="124" y="80" width="8" height="96" rx="4" fill="#38BDF8" />

    <!-- Mid Bar Right -->
    <rect x="136" y="92" width="8" height="72" rx="4" opacity="0.95" />

    <!-- Outer Bar Right -->
    <rect x="152" y="106" width="8" height="44" rx="4" opacity="0.8" />

    <!-- Edge Bar Right -->
    <rect x="168" y="118" width="8" height="20" rx="4" opacity="0.6" />
  </g>

  <!-- Cryptographic Shield Apex Lock Node -->
  <circle cx="128" cy="62" r="5" fill="#38BDF8" />
</svg>
