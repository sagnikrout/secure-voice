name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SecureVoice v3.1.0
          body_path: docs/RELEASE_NOTES_v3.1.0.md
          files: |
            SecureVoice-*.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
