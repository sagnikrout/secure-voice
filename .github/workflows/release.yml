name: Android Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Dependencies (Resilient CI)
        run: |
          npm ci || (echo "⚠️ Lockfile mismatch detected. Auto-syncing lockfile..." && npm install --package-lock-only && npm ci)

      - name: Build Web Bundle
        run: npm run build

      - name: Sanitize and Prepare Gradlew
        run: |
          sed -i "s/\r$//" android/gradlew
          chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/securevoice-release.keystore
          fi

      - name: Build APK
        working-directory: ./android
        env:
          KEYSTORE_FILE: securevoice-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Checksum
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk SecureVoice-${{ github.ref_name }}.apk
          elif [ -f "app-release.apk" ]; then
            mv app-release.apk SecureVoice-${{ github.ref_name }}.apk
          fi
          sha256sum SecureVoice-${{ github.ref_name }}.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: "true"
          generate_release_notes: true
          body: |
            ### SecureVoice ${{ github.ref_name }}

            - **85% Smaller Download**: Purged unused assets, shrinking release APK from 15.05 MB to 2.3 MB.
            - **RNNoise v0.2 AI Noise Removal**: Real-time neural background noise reduction running in dedicated AudioWorklet threads.
            - **Acoustic Presets & 6-Stage Filter Bank**: Standard, Voice Boost, Studio Clean, and Voice Isolation profiles with parametric EQ and dynamics compression.
            - **Hardened Security**: Ephemeral ECDH (P-256) forward secrecy with session key wipe upon disconnect, anti-downgrade signal protection, Subresource Integrity (SRI), and disabled WebView debugging.
            - **Telecom & Codec**: Dynamic 6-tier Opus bitrate adaptation down to 2.4 kbps floor with RFC 2198 RED packet loss protection.
            - **Compatibility**: Android 9.0+ (API level 28+) required for background audio execution and foreground service microphone policies.

            #### Verification
            - SHA-256 checksums are listed in `SHA256SUMS.txt`.
          files: |
            android/app/build/outputs/apk/release/SecureVoice-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
