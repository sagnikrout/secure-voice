name: Android Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Sanitize Gradlew
        run: sed -i "s/\r$//" android/gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Generate Checksum
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release-unsigned.apk SecureVoice-${{ github.ref_name }}.apk
          sha256sum SecureVoice-${{ github.ref_name }}.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "true"
          files: |
            android/app/build/outputs/apk/release/SecureVoice-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
