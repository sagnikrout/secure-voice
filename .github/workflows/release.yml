name: Android Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sanitize and Prepare Gradlew
        run: |
          sed -i "s/\r$//" android/gradlew
          chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/securevoice-release.keystore
          fi

      - name: Build APK
        working-directory: ./android
        env:
          KEYSTORE_FILE: securevoice-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Checksum
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk SecureVoice-${{ github.ref_name }}.apk
          elif [ -f "app-release.apk" ]; then
            mv app-release.apk SecureVoice-${{ github.ref_name }}.apk
          fi
          sha256sum SecureVoice-${{ github.ref_name }}.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "true"
          files: |
            android/app/build/outputs/apk/release/SecureVoice-${{ github.ref_name }}.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
